<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>September 6 Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 360px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
            padding: 30px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 8px 14px;
            border-radius: 22px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            color: #1f2d3d;
            margin: 10px 0;
            font-size: 2rem;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        button {
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Date: September 6</div>
        <h1>Example Program</h1>
        <p>This is one example program created on September 6th.</p>
        <button>Open Example</button>
    </div>
</body>
</html>
