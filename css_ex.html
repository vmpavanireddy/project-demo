<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> :root {
            --bg-1: #6d5bd0;
            --bg-2: #c8b6ff;
            --text: #2a1742;
            --card: rgba(255, 255, 255, 0.92);
            --accent: #8e7dff;
            --accent-2: #b388eb;
            --shadow: rgba(42, 23, 66, 0.2);
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            width: min(960px, 92vw);
            display: grid;
            gap: 18px;
            justify-items: center;
        }
        .container::before {
            content: 'Lavender CSS Theme';
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--accent);
        }
        .grid-container, .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }
        .grid-item, .flex-item, .button, .transition-example, .animation-example, .pseudo-class-example, .pseudo-element-example, [data-highlight] {
            background: var(--card);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            box-shadow: 0 8px 20px var(--shadow);
        }
        .button:hover, .transition-example:hover, .animation-example:hover, .pseudo-class-example:hover {
            transform: translateY(-3px);
            background: var(--accent-2);
            color: white;
        }
        .pseudo-element-example::after {
            content: ' 💜';
            color: var(--accent);
        }
        
</style>
</head>
<body>
    /* HTML content */
    <div class="container">
        <div class="grid-container">
            <div class="grid-item">Grid Item 1</div>
            <div class="grid-item">Grid Item 2</div>
            <div class="grid-item">Grid Item 3</div>
        </div>
        <div class="flex-container">
            <div class="flex-item">Flex Item 1</div>
            <div class="flex-item">Flex Item 2</div>
            <div class="flex-item">Flex Item 3</div>
        </div>
        <button class="button">Hover Me</button>
        <div data-highlight>Attribute Selector Example</div>
        <button class="transition-example">Transition Example</button>
        <button class="animation-example">Animation Example</button>    
        <button class="pseudo-class-example">Pseudo-Class Example</button>
        <button class="pseudo-element-example">Pseudo-Element Example</button>
    </div>
    // JavaScript example
    <script>
        document.querySelector('.button').addEventListener('click', function() {
            alert('Button clicked!');
        });
    </script>
</body>
</html>
