        .example-aug17 {
            padding: 30px;

            font-family: Arial, sans-serif;
        }

        .example-aug17 h2 {
            color: #1f3a93;

        }

        .card {
            width: 300px;
            margin: 0 auto;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card button {
            background: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #1f3a93;
            font-weight: bold;
            cursor: pointer;
        }

<body>

    <div class="container">
        <div class="box">
            <h1>CSS</h1>
        </div>
    </div>

    <section class="example-aug17">
        <h2>August 17 Example</h2>
        <div class="card">

        </div>
    </section>

    <div class="hotel-bill">

        <h2>Customer Bill</h2>
        <hr style="width:70%">
        <h3>Date: <span id="date"></span></h3>

        <div class="input-row">
            <label>Items:</label>
            <select id="itemSelect">
                <option value="Biryani">Biryani - 140</option>
                <option value="Fried Rice">Fried Rice - 110</option>
                <option value="Chicken Curry">Chicken Curry - 230</option>

        </div>
    </div>
